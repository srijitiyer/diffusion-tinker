[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-tinker"
dynamic = ["version"]
description = "RL-based post-training for diffusion models"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Srijit Iyer"},
    {name = "Haotian Ye"},
    {name = "Jiaqi Han"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.5",
    "torchvision>=0.16.0",
    "diffusers>=0.31.0",
    "transformers>=4.40.0",
    "peft>=0.12.0",
    "Pillow",
    "huggingface-hub>=0.20.0",
    "safetensors>=0.4.0",
    "numpy>=1.24.0",
]

[project.urls]
Homepage = "https://github.com/srijitiyer/diffusion-tinker"
Repository = "https://github.com/srijitiyer/diffusion-tinker"

[project.optional-dependencies]
hps = ["open-clip-torch>=2.24.0"]
ocr = ["easyocr>=1.7.0"]
data = ["datasets>=2.14.0"]
wandb = ["wandb"]
dev = [
    "diffusion-tinker[data,wandb]",
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "diffusion_tinker._version.__version__"}

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
